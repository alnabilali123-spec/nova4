name: Build NovaTube APK

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        type: choice
        default: debug
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    name: Build APK (${{ github.event.inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Xmx4g
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            ${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Fetch gradle wrapper jar (if missing)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading gradle-wrapper.jar..."
            mkdir -p gradle/wrapper
            curl -fSL -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
            ls -la gradle/wrapper/
          else
            echo "gradle-wrapper.jar already present"
          fi

      - name: Decode Android signing keystore (release only)
        if: env.BUILD_TYPE == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/novatube.keystore
            echo "Keystore decoded: $(ls -la app/novatube.keystore)"
          else
            echo "No keystore secrets found - release will be unsigned"
          fi

      - name: Build Debug APK
        if: env.BUILD_TYPE == 'debug'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        if: env.BUILD_TYPE == 'release'
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 != '' && 'novatube.keystore' || '' }}

      - name: Verify APK
        run: |
          echo "=== Build output ==="
          find app/build/outputs -name "*.apk" -type f -exec ls -la {} \;
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "=== Debug APK info ==="
            file app/build/outputs/apk/debug/app-debug.apk
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "=== Release APK info ==="
            file app/build/outputs/apk/release/app-release.apk
          fi

      - name: Upload Debug APK
        if: env.BUILD_TYPE == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: NovaTube-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Release APK
        if: env.BUILD_TYPE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: NovaTube-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90
          if-no-files-found: warn

      - name: Upload mapping files
        if: env.BUILD_TYPE == 'release' && always()
        uses: actions/upload-artifact@v4
        with:
          name: NovaTube-mapping
          path: app/build/outputs/mapping/release/
          retention-days: 30
          if-no-files-found: ignore

      - name: Cleanup keystore
        if: always()
        run: rm -f app/novatube.keystore

  build-all:
    name: Build All Variants
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Fetch gradle wrapper jar (if missing)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            curl -fSL -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Build both debug and release
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload all APKs
        uses: actions/upload-artifact@v4
        with:
          name: NovaTube-all
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          retention-days: 30
